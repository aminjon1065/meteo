// Источники данных (producers) SmartMet Server портала.
// GFS пишет загрузчик пакета smartmet-data-gfs в /smartmet/data/gfs/<AREA>/{surface,pressure}/querydata,
// AREA задана в infra/smartmet/cnf/data/gfs.cnf.

@include "querydata/translations.conf"

verbose = false;

valid_points_cache_dir = "/var/smartmet/cache/validpoints";

// Порядок важен: без producer= берётся первый, у которого есть данные в точке.
producers =
[
        "gfs_surface",
        "gfs_pressure"
];

gfs_surface:
{
        alias                   = ["gfs", "gfs_tajikistan_surface"];
        directory               = "/smartmet/data/gfs/tajikistan/surface/querydata";
        pattern                 = ".*_gfs_.*_surface\.sqd$";
        forecast                = true;
        type                    = "grid";
        leveltype               = "surface";
        refresh_interval_secs   = 60;
        number_to_keep          = 4;
        multifile               = true;
};

gfs_pressure:
{
        alias                   = ["gfs_tajikistan_pressure"];
        directory               = "/smartmet/data/gfs/tajikistan/pressure/querydata";
        pattern                 = ".*_gfs_.*_pressure\.sqd$";
        forecast                = true;
        type                    = "grid";
        leveltype               = "pressure";
        refresh_interval_secs   = 60;
        number_to_keep          = 2;
};
