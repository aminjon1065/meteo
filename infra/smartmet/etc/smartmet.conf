// SmartMet Server на сервере портала: только нужные движки и плагины.
// Основа — /etc/smartmet/smartmet.conf образа fmidev/smartmetserver:26.08.01. Убраны sputnik (кластер),
// плагины download, edr, q3, autocomplete и встроенный /admin с паролем по умолчанию.
// Порядок движков как в образе (observation загружается после geonames).
// Движки avi, grid и observation подключены, но выключены в своих файлах образа (disabled/enabled = false):
// плагины timeseries и wms собраны с ними и без них не загружаются.
// Остальные файлы engines/*.conf и plugins/*.conf — из образа, кроме смонтированных из infra/smartmet/etc.

port            = 8080;

defaultlogging  = false;
logrequests     = true;
accesslogdir    = "/var/log/smartmet";

verbose         = false;
debug           = false;

lazylinking     = true;

compress        = true;
compresslimit   = 1000;

slowpool:
{
        maxthreads      = 8;
        maxrequeuesize  = 100;
};

fastpool:
{
        maxthreads      = 8;
        maxrequeuesize  = 100;
};

engines:
{
        avi:
        {
                configfile = "engines/avi.conf";
        };
        contour:
        {
                configfile = "engines/contour.conf";
        };
        geonames:
        {
                configfile = "engines/geonames.conf";
        };
        gis:
        {
                configfile = "engines/gis.conf";
        };
        querydata:
        {
                configfile = "engines/querydata.conf";
        };
        grid:
        {
                configfile = "engines/grid.conf";
        };
        observation:
        {
                configfile = "engines/observation.conf";
        };
};

plugins:
{
        timeseries:
        {
                configfile = "plugins/timeseries.conf";
        };
        wms:
        {
                configfile = "plugins/wms.conf";
        };
};
