# SmartMet Server (FMI) и загрузка данных моделей — отдельный compose-проект на сервере портала.
# На хосте: /opt/smartmet — этот каталог, /smartmet — данные в штатной раскладке FMI (data, logs, tmp, editor).
# Наружу ничего не публикуется: портал ходит в сеть «smartmet» по адресу http://smartmet:8080,
# для проверок с хоста — http://127.0.0.1:8180.
name: smartmet

services:
  server:
    image: fmidev/smartmetserver:26.08.01
    restart: unless-stopped
    hostname: smartmet
    volumes:
      - /smartmet/data:/smartmet/data:ro
      - ./etc/smartmet.conf:/etc/smartmet/smartmet.conf:ro
      - ./etc/engines/querydata.conf:/etc/smartmet/engines/querydata.conf:ro
      - ./etc/plugins/wms.conf:/etc/smartmet/plugins/wms.conf:ro
      # Слои WMS для портала: tajikistan:temperature, tajikistan:precipitation, … (палитры — ресурсы образа)
      - ./wms/customers/tajikistan:/smartmet/share/wms/customers/tajikistan:ro
    ports:
      - "127.0.0.1:8180:8080"
    networks:
      smartmet:
        aliases: [smartmet]
    # Процесс работает от пользователя smartmet (101010) на порту 8080: привилегии не нужны.
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 3g
    cpus: 2
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8080/wms?service=WMS&request=GetCapabilities&version=1.3.0"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

  data:
    build: ./data
    image: smartmet-data:local
    restart: unless-stopped
    volumes:
      - /smartmet/data:/smartmet/data
      - /smartmet/logs:/smartmet/logs
      - /smartmet/tmp:/smartmet/tmp
      - /smartmet/editor:/smartmet/editor
      - ./cnf/data/gfs.cnf:/smartmet/cnf/data/gfs.cnf:ro
      - ./cnf/cron/cron.d/gfs.cron:/smartmet/cnf/cron/cron.d/gfs.cron:ro
    environment:
      TZ: UTC
    # Пользователь smartmet из образа; пишет только в тома /smartmet/* и /tmp.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    # Здоров, если свежий прогон GFS моложе 18 ч (загрузка 4 раза в сутки; два пропуска подряд — уже сбой).
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          now=$$(date +%s); for f in /smartmet/data/gfs/tajikistan/*/querydata/*_surface.sqd;
          do [ -f "$$f" ] && [ $$((now - $$(stat -c %Y "$$f"))) -lt 64800 ] && exit 0; done; exit 1
      interval: 10m
      timeout: 10s
      retries: 1
      start_period: 3h
    mem_limit: 1g
    cpus: 1
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

  # Веб-карта и CAP-лента SmartMet Alert (fmidev/smartalert-web): /capfeed.php — источник предупреждений
  # для портала (CAP_FEED_URL=http://smartalert/capfeed.php). Редактор SmartMet Alert публикует CAP по SFTP
  # (sftp/setup-editor-sftp.sh) в /smartmet/editor/smartalert/publishedCap/<год>/<месяц>/<YYYYMMDDHHmmss>/.
  # capfeed.php — наша правка файла FMI (Cancel, битые файлы; см. alert/capfeed.php и ADR-010).
  alert-web: &alert-web
    image: fmidev/smartmetalert:26.10.21
    restart: unless-stopped
    volumes:
      - /smartmet/editor/smartalert:/var/www/html/data:ro
      - ./alert/capfeed.php:/var/www/html/capfeed.php:ro
      - ./alert/capmap-config.js:/var/www/html/capmap-config.js:ro
      - ./alert/index.html:/var/www/html/index.html:ro
      - ./alert/vendor:/var/www/html/vendor:ro
    ports:
      - "127.0.0.1:8181:80"
    networks:
      smartmet:
        aliases: [smartalert]
    # Apache стартует от root и переходит на www-data: нужны только порт 80 и смена пользователя.
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE, SETUID, SETGID]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost/capfeed.php"]
      interval: 60s
      timeout: 10s
      retries: 3
    mem_limit: 256m
    cpus: 0.5
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

  # Тестовая лента только для staging (CAP_FEED_URL=http://smartalert-test/capfeed.php): приёмка M3 и
  # проверка редактора без риска показать тестовое сообщение на havo.tj. Каталог пишут генератор
  # alert/test-feed/cap-chain.mjs и (при проверке редактора) пользователь SFTP smartalert.
  alert-web-test:
    <<: *alert-web
    volumes:
      - /smartmet/editor/smartalert-test:/var/www/html/data:ro
      - ./alert/capfeed.php:/var/www/html/capfeed.php:ro
      - ./alert/capmap-config.js:/var/www/html/capmap-config.js:ro
      - ./alert/index.html:/var/www/html/index.html:ro
      - ./alert/vendor:/var/www/html/vendor:ro
    ports:
      - "127.0.0.1:8182:80"
    networks:
      smartmet:
        aliases: [smartalert-test]
    mem_limit: 128m
    cpus: 0.25

networks:
  smartmet:
    name: smartmet
