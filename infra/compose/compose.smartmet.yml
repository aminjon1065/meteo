# SmartMet Server и SmartMet Alert на том же хосте (infra/smartmet, docs/runbook.md §14): web и worker
# подключаются к сети Docker «smartmet» и обращаются к сервисам по именам smartmet и smartalert.
# deploy.sh и dc.sh добавляют этот файл сами, если сеть smartmet есть на хосте. Адреса — в .env:
#   SMARTMET_URL=http://smartmet:8080  SMARTMET_PRODUCER=gfs  SMARTMET_WMS_URL=http://smartmet:8080
#   CAP_FEED_URL=http://smartalert/capfeed.php
# В staging лента — тестовая (alert-web-test): CAP_FEED_URL=http://smartalert-test/capfeed.php и
# SMARTALERT_DIR=/smartmet/editor/smartalert-test, чтобы тестовые CAP не попадали на havo.tj.
services:
  web:
    networks:
      default: {}
      smartmet: {}
  worker:
    networks:
      default: {}
      smartmet: {}
  # Архив выпусков редактора SmartMet Alert — в снимки restic (infra/backup/run.sh, /srv/smartalert).
  backup:
    volumes:
      - ${SMARTALERT_DIR:-/smartmet/editor/smartalert}:/srv/smartalert:ro

networks:
  smartmet:
    external: true
