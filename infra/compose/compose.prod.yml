# Продакшен / staging: один хост, Caddy (TLS), web, worker, migrate, postgres, redis, backup.
# Запуск: docker compose --env-file .env -f infra/compose/compose.prod.yml up -d
#
# Усиление (docs/security-checklist.md): приложения работают от непривилегированных пользователей
# образов, корневая ФС только для чтения (запись — в именованные тома и tmpfs), сброшены все
# capabilities, запрещён рост привилегий, ограничены память/число процессов, ротация логов.
name: meteo

x-app-env: &app-env
  NODE_ENV: production
  DATABASE_URL: postgres://meteo:${POSTGRES_PASSWORD}@postgres:5432/meteo
  REDIS_URL: redis://redis:6379
  BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
  BETTER_AUTH_URL: https://${SITE_ADDRESS}
  NEXT_PUBLIC_APP_URL: https://${SITE_ADDRESS}
  TZ: UTC

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-hardening: &hardening
  read_only: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  logging: *default-logging

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - tiles:/srv/tiles:ro
      - silam:/srv/silam:ro
      - uploads:/srv/uploads:ro
    tmpfs:
      - /tmp
    # Caddy слушает 80/443 — единственная нужная capability.
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 256m
          pids: 256
    depends_on:
      web:
        condition: service_healthy

  web:
    image: ghcr.io/meteo-tj/meteoportal-web:${IMAGE_TAG:-latest}
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    <<: *hardening
    environment:
      <<: *app-env
      PORT: 3000
      HOSTNAME: 0.0.0.0
      SILAM_DIR: /app/silam
      UPLOADS_DIR: /app/uploads
      # Пакеты импорта CSV между предпросмотром и применением; корневая ФС только для чтения,
      # поэтому каталог — в tmpfs (после перезапуска неприменённый пакет надо загрузить заново).
      IMPORTS_DIR: /tmp/imports
      RATE_LIMIT_API_PER_MINUTE: ${RATE_LIMIT_API_PER_MINUTE:-120}
      RATE_LIMIT_AUTH_PER_MINUTE: ${RATE_LIMIT_AUTH_PER_MINUTE:-30}
      RATE_LIMIT_INGEST_PER_MINUTE: ${RATE_LIMIT_INGEST_PER_MINUTE:-60}
      RATE_LIMIT_SUBSCRIBE_PER_MINUTE: ${RATE_LIMIT_SUBSCRIBE_PER_MINUTE:-10}
      EMBED_FRAME_ANCESTORS: ${EMBED_FRAME_ANCESTORS:-https://meteo.tj https://*.meteo.tj}
      STATION_INGEST_STALE_MIN: ${STATION_INGEST_STALE_MIN:-180}
      # Ключ шифрования учётных данных источников станций — один и тот же у web (шифрует) и worker
      # (расшифровывает); пустое значение = BETTER_AUTH_SECRET.
      STATION_SOURCES_KEY: ${STATION_SOURCES_KEY:-}
      # Для признака «SMTP настроен» на дашборде админки (отправляет письма worker).
      SMTP_URL: ${SMTP_URL:-}
    volumes:
      - uploads:/app/uploads
      - silam:/app/silam:ro
    tmpfs:
      # кэш next/image, пакеты импорта и временные файлы — единственное, что web пишет вне томов
      - /tmp
      - /app/apps/web/.next/cache
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 1g
          pids: 512

  worker:
    image: ghcr.io/meteo-tj/meteoportal-worker:${IMAGE_TAG:-latest}
    build:
      context: ../..
      dockerfile: apps/worker/Dockerfile
    restart: unless-stopped
    # Задачи (SILAM, pull‑источники) могут выполняться минутами: даём им завершиться штатно.
    stop_grace_period: 60s
    <<: *hardening
    environment:
      <<: *app-env
      WORKER_PORT: 3001
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-4}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SILAM_DIR: /app/silam
      UPLOADS_DIR: /app/uploads
      # Переменные из .env доступны контейнеру только перечисленные здесь (compose не передаёт
      # .env целиком). Пустое значение (переменная не задана) worker считает отсутствующим.
      SMTP_URL: ${SMTP_URL:-}
      MAIL_FROM: ${MAIL_FROM:-Метеопортал <noreply@meteo.tj>}
      ADMIN_ALERT_EMAILS: ${ADMIN_ALERT_EMAILS:-}
      SMARTMET_URL: ${SMARTMET_URL:-}
      SMARTMET_PRODUCER: ${SMARTMET_PRODUCER:-}
      SMARTMET_API_KEY: ${SMARTMET_API_KEY:-}
      SMARTMET_HOURLY_STEPS: ${SMARTMET_HOURLY_STEPS:-}
      SMARTMET_DAILY_DAYS: ${SMARTMET_DAILY_DAYS:-}
      SILAM_NCSS_URL: ${SILAM_NCSS_URL:-}
      SILAM_DATASET: ${SILAM_DATASET:-}
      SILAM_KEEP_RUNS: ${SILAM_KEEP_RUNS:-}
      CAP_FEED_URL: ${CAP_FEED_URL:-}
      CAP_TIMEOUT_MS: ${CAP_TIMEOUT_MS:-}
      INTEGRATION_ALERT_FAILURES: ${INTEGRATION_ALERT_FAILURES:-}
      INTEGRATION_CIRCUIT_FAILURES: ${INTEGRATION_CIRCUIT_FAILURES:-}
      INTEGRATION_CIRCUIT_COOLDOWN_MIN: ${INTEGRATION_CIRCUIT_COOLDOWN_MIN:-}
      INTEGRATION_CIRCUIT_MAX_COOLDOWN_MIN: ${INTEGRATION_CIRCUIT_MAX_COOLDOWN_MIN:-}
      STATION_SOURCES_KEY: ${STATION_SOURCES_KEY:-}
      STATION_PULL_TIMEOUT_MS: ${STATION_PULL_TIMEOUT_MS:-}
      STATION_PULL_MAX_FILE_MB: ${STATION_PULL_MAX_FILE_MB:-}
      STATION_PULL_LOOKBACK_DAYS: ${STATION_PULL_LOOKBACK_DAYS:-}
      STATION_INGEST_STALE_MIN: ${STATION_INGEST_STALE_MIN:-}
    volumes:
      - silam:/app/silam
      - uploads:/app/uploads:ro
    tmpfs:
      - /tmp
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 1g
          pids: 512

  migrate:
    image: ghcr.io/meteo-tj/meteoportal-worker:${IMAGE_TAG:-latest}
    command: ["node", "dist/migrate.js"]
    <<: *hardening
    environment:
      <<: *app-env
      DB_MIGRATIONS_DIR: /app/db/drizzle
      DB_SQL_DIR: /app/db/sql
    tmpfs:
      - /tmp
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    deploy:
      resources:
        limits:
          memory: 512m
          pids: 128

  postgres:
    image: timescale/timescaledb-ha:pg17
    restart: unless-stopped
    # Образ работает от пользователя postgres; корневая ФС остаётся записываемой (сокеты, статистика).
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    environment:
      POSTGRES_USER: meteo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: meteo
      TZ: UTC
    volumes:
      - pgdata:/home/postgres/pgdata/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meteo -d meteo"]
      interval: 10s
      timeout: 5s
      retries: 12
    command: >
      postgres
      -c shared_preload_libraries=timescaledb
      -c timescaledb.telemetry_level=off
      -c timezone=UTC
      -c max_connections=100
    deploy:
      resources:
        limits:
          memory: 2g
          pids: 512

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Пользователь redis образа (uid 999): без смены пользователя в entrypoint capabilities не нужны.
    user: "999:1000"
    <<: *hardening
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redisdata:/data
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 12
    deploy:
      resources:
        limits:
          memory: 384m
          pids: 128

  backup:
    image: ghcr.io/meteo-tj/meteoportal-backup:${IMAGE_TAG:-latest}
    build:
      context: ../backup
    restart: unless-stopped
    <<: *hardening
    environment:
      PGHOST: postgres
      PGUSER: meteo
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: meteo
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-30}
      BACKUP_KEEP_DAILY: ${BACKUP_KEEP_DAILY:-30}
      BACKUP_KEEP_MONTHLY: ${BACKUP_KEEP_MONTHLY:-12}
      BACKUP_TIME_UTC: ${BACKUP_TIME_UTC:-21:00}
      # restic: локальный репозиторий в томе backups; офсайт — RESTIC_REPOSITORY=s3:… + ключи доступа.
      RESTIC_REPOSITORY: ${RESTIC_REPOSITORY:-/backups/restic}
      RESTIC_PASSWORD: ${RESTIC_PASSWORD:-}
      AWS_ACCESS_KEY_ID: ${RESTIC_AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${RESTIC_AWS_SECRET_ACCESS_KEY:-}
    volumes:
      - backups:/backups
      - uploads:/srv/uploads:ro
      - silam:/srv/silam:ro
    tmpfs:
      - /tmp
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512m
          pids: 128

volumes:
  pgdata:
  redisdata:
  caddy_data:
  caddy_config:
  tiles:
  silam:
  uploads:
  backups:
