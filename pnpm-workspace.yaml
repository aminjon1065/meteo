packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  "@biomejs/biome": true
  "@parcel/watcher": true
  "@swc/core": true
  "@tailwindcss/oxide": true
  "@node-rs/argon2": true
  esbuild: true
  msgpackr-extract: true
  sharp: true
  unrs-resolver: true
  # ssh2 (station-pull) работает без нативного дополнения; cpu-features — его необязательная зависимость.
  # Явное false нужно: с заглушкой pnpm 12 в CI (сборка образов) падает с ERR_PNPM_IGNORED_BUILDS.
  cpu-features: false
  ssh2: false

minimumReleaseAgeExclude:
  - better-auth@1.7.10
  - next@16.4.2
  - vitest@5.0.5
  - '@better-auth/core@1.7.10'
  - '@better-auth/drizzle-adapter@1.7.10'
  - '@better-auth/kysely-adapter@1.7.10'
  - '@better-auth/memory-adapter@1.7.10'
  - '@better-auth/mongo-adapter@1.7.10'
  - '@better-auth/prisma-adapter@1.7.10'
  - '@better-auth/telemetry@1.7.10'
  - '@vitest/mocker@5.0.5'
  - '@vitest/spy@5.0.5'

# Исключения pnpm audit - только с обоснованием, по одному идентификатору (docs/security-checklist.md, п. 6.1).
auditConfig:
  ignoreGhsas:
    # picomatch ≤ 4.0.7: ReDoS на подобранных шаблонах-глобах (+(*) и т. п.), исправленной версии нет (18.11.2026).
    # В production-дерево попадает только через инструменты: better-auth → vitest (необязательный peer, в образы не
    # входит - pnpm deploy --prod --no-optional) и next-intl → @parcel/watcher (слежение за файлами при разработке).
    # Шаблоны задаются в коде, пользовательский ввод до picomatch не доходит. Убрать, когда выйдет исправление.
    - GHSA-fc5q-39xc-vjpf
